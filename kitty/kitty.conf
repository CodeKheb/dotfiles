font_size 18.0

font_family JetBrains Mono

hide_window_decorations yes
window_padding_width 5

scrollback_lines 5000

cursor_shape block
cursor_blink_interval 0.5

enable_audio_bell no
confirm_os_window_close 0

# Launch
map ctrl+t launch --type=overlay tmux
map ctrl+v launch --type=overlay nvim .

# Clear
map ctrl+space send_text all clear\x0d

# Movements
map ctrl+h send_text all \x1b[1;5D
map ctrl+l send_text all \x1b[1;5C
map ctrl+j send_text all \x1b[1;5B
map ctrl+k send_text all \x1b[1;5A

# Scroll
map alt+k scroll_page_up
map alt+j scroll_page_down

# Zoom
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0
