font_size 18.0

font_family JetBrains Mono

hide_window_decorations yes
window_padding_width 5

scrollback_lines 5000

cursor_shape block
cursor_blink_interval 0.5

enable_audio_bell no
confirm_os_window_close 0

# Launch
map ctrl+enter launch --type=overlay --cwd=current nvim .
map ctrl+e launch --type=overlay --cwd=current yazi
map ctrl+f send_text all freebuff\x0d

# Tabs
tab_bar_background none
active_tab_background #000000
inactive_tab_background #000000
active_tab_foreground #ffffff
inactive_tab_foreground #000000
map alt+t new_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4

# Clear
map ctrl+space send_text all clear\x0d

# Movements
map alt+h send_text all \x1b[1;5D
map alt+l send_text all \x1b[1;5C
map alt+shift+l send_text all \x05
map alt+shift+h send_text all \x01

# Scroll
map alt+k scroll_page_up
map alt+j scroll_page_down

# Zoom
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+r change_font_size all 0
